name: release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag matching the package version (for example v0.3.0-pre1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: python -m pip install -r packaging/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer

      - name: Unit tests (game-dependent tests skip without a game install)
        run: python -m unittest discover -s tests -v

      - name: Build Tauri installer EXE and ZIP
        run: python packaging/build_release_rust.py release/rust-installer

      - name: Point the release tests at the new build
        shell: pwsh
        run: |
          $dir = "release/rust-installer/TheLongDrive-Roadworthy"
          $exe = Join-Path $dir "TheLongDrive-Roadworthy.exe"
          if (-not (Test-Path $exe)) { throw "The Rust build produced no installer EXE" }
          "ROADWORTHY_RELEASE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Release artifact tests
        run: python -m unittest discover -s tests -p "test_release_artifacts.py" -v

      - name: Build and verify GUI Steam updater
        run: python packaging/build_steam_updater.py

      - name: Upload GUI Steam updater
        uses: actions/upload-artifact@v4
        with:
          name: Roadworthy-Steam-Update
          path: release/steam-update-exe/Roadworthy-Steam-Update.exe
          if-no-files-found: error

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: TheLongDrive-Roadworthy
          path: release/rust-installer/TheLongDrive-Roadworthy/

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Roadworthy-release-zip
          path: release/rust-installer/TheLongDrive-Roadworthy-v*.zip
          if-no-files-found: error

      # The installer EXE carries the whole patch, so it works without the rest of the ZIP.
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Roadworthy-release-exe
          path: release/rust-installer/TheLongDrive-Roadworthy/TheLongDrive-Roadworthy.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = python -c "import pathlib,re; t=pathlib.Path('installer/core/src/consts.rs').read_text(); print(re.search(r'pub const VERSION: &str = \"([^\"]+)\"', t).group(1))"
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match package version v$version" }
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $existing = git ls-remote --tags origin $tagRef "$tagRef^{}"
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing tag" }
          if ($existing) {
            git fetch origin "${tagRef}:${tagRef}"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing tag" }
            $tagCommit = git rev-parse "$tagRef^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) { throw "Existing tag does not point to the tested commit" }
          }
      - uses: actions/download-artifact@v4
        with:
          name: Roadworthy-release-zip
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Roadworthy-release-exe
          path: dist-exe
      - name: Name the standalone EXE after the release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $exe = "dist-exe/TheLongDrive-Roadworthy.exe"
          if (-not (Test-Path $exe)) { throw "Standalone EXE artifact is missing" }
          Move-Item $exe "dist/TheLongDrive-Roadworthy-$env:RELEASE_TAG.exe"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG "dist/TheLongDrive-Roadworthy-$env:RELEASE_TAG.zip" "dist/TheLongDrive-Roadworthy-$env:RELEASE_TAG.exe" --target $env:GITHUB_SHA --title "Roadworthy $env:RELEASE_TAG" --notes-file CHANGELOG.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
