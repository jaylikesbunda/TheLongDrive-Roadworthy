name: release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag matching the package version (for example v0.1.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: python -m pip install -r packaging/requirements.txt

      - name: Unit tests (game-dependent tests skip without a game install)
        run: python -m unittest discover -s tests -v

      - name: Build release EXE and ZIP
        run: python packaging/build_release.py

      - name: Release artifact tests
        run: python -m unittest discover -s tests -p "test_release_artifacts.py" -v

      - name: Build and verify GUI Steam updater
        run: python packaging/build_steam_updater.py

      - name: Upload GUI Steam updater
        uses: actions/upload-artifact@v4
        with:
          name: Roadworthy-Steam-Update
          path: release/steam-update-exe/Roadworthy-Steam-Update.exe
          if-no-files-found: error

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: TheLongDrive-Roadworthy
          path: release/TheLongDrive-Roadworthy/

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Roadworthy-release-zip
          path: release/TheLongDrive-Roadworthy-v*.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = python -c "import ast,pathlib; p=ast.parse(pathlib.Path('packaging/build_release.py').read_text()); print(next(n.value.value for n in p.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='VERSION' for t in n.targets)))"
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match package version v$version" }
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $existing = git ls-remote --tags origin $tagRef "$tagRef^{}"
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing tag" }
          if ($existing) {
            git fetch origin "${tagRef}:${tagRef}"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing tag" }
            $tagCommit = git rev-parse "$tagRef^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) { throw "Existing tag does not point to the tested commit" }
          }
      - uses: actions/download-artifact@v4
        with:
          name: Roadworthy-release-zip
          path: dist
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG "dist/TheLongDrive-Roadworthy-$env:RELEASE_TAG.zip" --target $env:GITHUB_SHA --title "Roadworthy $env:RELEASE_TAG" --notes-file CHANGELOG.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
