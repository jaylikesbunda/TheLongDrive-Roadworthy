[package]
name = "roadworthy-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
rfd = "=0.17.2"
roadworthy-core = { version = "0.1.0", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "=2.12.1", features = ["custom-protocol"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "=2.7.1"

[[bin]]
name = "TheLongDrive-Roadworthy"
path = "src/main.rs"
